# TEMPORARY: verifies the theme-upgrade branch builds with GitHub Pages'
# gems (github-pages 232). Deleted before the pull request is merged.
name: Verify theme upgrade (temporary)

on:
  push:
    branches: [theme-upgrade]

permissions:
  contents: read

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/../ci-gems/Gemfile
      JEKYLL_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PAGES_REPO_NWO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Write a Gemfile pinned to github-pages 232
        run: |
          mkdir -p "$(dirname "$BUNDLE_GEMFILE")"
          cat > "$BUNDLE_GEMFILE" <<'GEMS'
          source "https://rubygems.org"
          gem "github-pages", "232", group: :jekyll_plugins
          gem "webrick"
          GEMS

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Show Jekyll and Sass versions
        run: |
          bundle exec jekyll --version
          echo "::notice title=versions::$(bundle exec gem list | grep -E '^(jekyll|jekyll-sass-converter|sass|sassc|liquid|kramdown|github-pages) ' | tr '\n' ';')"

      - name: Jekyll build (production)
        env:
          JEKYLL_ENV: production
        run: |
          bundle exec jekyll build --safe --trace > build.log 2>&1 && exit 0
          # Surface the error as annotations (logs are not readable from outside)
          grep -nE "Error|error|Exception|Invalid|Liquid|line [0-9]" build.log | head -25 | while read -r l; do echo "::error title=jekyll build::${l:0:900}"; done
          tail -n 8 build.log | while read -r l; do echo "::error title=build tail::${l:0:900}"; done
          exit 1

      - name: No build warnings or Liquid errors
        run: |
          if grep -nE "Warning|Liquid Exception|Liquid Warning|Error" build.log; then
            grep -nE "Warning|Liquid Exception|Liquid Warning|Error" build.log | while read -r l; do echo "::error title=build log::$l"; done
            exit 1
          fi

      - name: Install html-proofer
        run: gem install html-proofer -v "~> 5.0" --no-document

      - name: html-proofer (internal links, images, scripts)
        run: |
          set -o pipefail
          # --allow-missing-href: the theme's light/dark toggle is an <a role="button">
          #   without href; the next step checks no other anchor lacks one.
          # --no-enforce-https: the (unlisted) Photography page loads its widget
          #   from a protocol-relative URL (external, so ignored); that is content.
          htmlproofer ./_site --disable-external --checks Links,Images,Scripts \
            --allow-missing-href --no-enforce-https \
            --ignore-urls "/^https?:/,/^\/\//" 2>&1 | tee proofer.log || {
            grep -vE "^\s*$" proofer.log | grep -vE "^\* At " | sed -E 's/^\s+//' | sort | uniq -c | sort -rn | head -40 | while read -r l; do echo "::error title=html-proofer::${l:0:900}"; done
            exit 1
          }

      - name: Every internal href/src resolves to a built file
        run: |
          python3 - <<'PY'
          import os, re, sys, html
          from urllib.parse import urlsplit, unquote
          root = "_site"; bad = []; checked = set()
          attr = re.compile(r'(?:href|src)\s*=\s*"([^"]*)"')
          for d, _, fs in os.walk(root):
              for f in fs:
                  if not f.endswith(".html"): continue
                  page = os.path.join(d, f)
                  for url in attr.findall(open(page, encoding="utf-8").read()):
                      url = html.unescape(url).strip()
                      if not url or url.startswith(("#", "mailto:", "tel:", "javascript:", "data:")): continue
                      u = urlsplit(url)
                      if u.scheme or u.netloc:
                          if u.netloc.lower() != "drsgbhat.github.io": continue
                      path = unquote(u.path)
                      if not path: continue
                      base = root + path if path.startswith("/") else os.path.join(d, path)
                      cands = [base, os.path.join(base, "index.html"), base + ".html"]
                      checked.add(path)
                      if not any(os.path.isfile(c) for c in cands):
                          bad.append(f"{page}: {url}")
          print(f"checked {len(checked)} distinct internal paths")
          print(f"::notice title=internal links::checked {len(checked)} distinct internal paths")
          for b in sorted(set(bad))[:50]: print(f"::error title=broken internal link::{b}")
          sys.exit(1 if bad else 0)
          PY

      - name: Only the theme toggle is an anchor without href
        run: |
          bad=$(grep -rhoE "<a( [^>]*)?>" _site --include=*.html | grep -v "href=" | grep -v 'aria-labelledby="theme-icon"' | sort | uniq -c || true)
          if [ -n "$bad" ]; then echo "$bad" | while read -r l; do echo "::error title=anchor without href::$l"; done; exit 1; fi

      - name: GA4 tag only in production
        run: |
          set -e
          grep -q "googletagmanager.com/gtag/js?id=G-G39J6CJ1T7" _site/index.html || { echo "::error::GA4 tag missing from production build"; exit 1; }
          JEKYLL_ENV=development bundle exec jekyll build --safe -d _site_dev
          if grep -rl "googletagmanager" _site_dev; then echo "::error::GA4 tag present in development build"; exit 1; fi

      - name: Theme assets and compiled CSS
        run: |
          set -e
          fail=0
          for f in _site/assets/css/main.css _site/assets/css/fontawesome.css _site/assets/js/main.min.js _site/favicon.ico _site/images/favicon-16x16.png _site/images/favicon-32x32.png _site/images/apple-touch-icon.png _site/images/android-chrome-192x192.png _site/images/android-chrome-512x512.png _site/images/manifest.json _site/images/sandesh.jpg _site/robots.txt _site/sitemap.xml _site/feed.xml; do
            [ -s "$f" ] || { echo "::error::missing $f"; fail=1; }
          done
          grep -q "252a34" _site/assets/css/main.css || { echo "::error::site background colour missing from main.css"; fail=1; }
          grep -q "publication-list" _site/assets/css/main.css || { echo "::error::.publication-list rule missing"; fail=1; }
          grep -q "Font Awesome Free 6" _site/assets/css/fontawesome.css || { echo "::error::fontawesome.css is not Font Awesome 6"; fail=1; }
          grep -q "fa-solid-900" _site/assets/css/fontawesome.css || { echo "::error::fontawesome.css has no webfont"; fail=1; }
          grep -q 'data-theme="dark"' _site/index.html || { echo "::error::dark default not set on <html>"; fail=1; }
          exit $fail

      - name: Pages, redirects and publications
        run: |
          set -e
          fail=0
          for p in index cv/index publications/index presentations/index teaching/index service/index contact/index sitemap/index 404 awards/index mytravel/index Photography/index about/index; do
            f="_site/$p.html"; [ -s "$f" ] || { echo "::error::missing $f"; fail=1; }
          done
          n=$(ls _site/publications | grep -vc '^index.html$' || true)
          [ "$n" -eq 29 ] || { echo "::error::expected 29 publication pages, found $n"; fail=1; }
          for removed in year-archive markdown non-menu-page archive-layout-with-content terms talks talkmap portfolio posts tags categories collection-archive page-archive; do
            [ ! -e "_site/$removed" ] && [ ! -e "_site/$removed.html" ] || { echo "::error::removed page came back: $removed"; fail=1; }
          done
          for meta in 'name="description"' 'property="og:description"' 'property="og:image"' '"sameAs"' '"image"'; do
            grep -q "$meta" _site/publications/index.html || { echo "::error::publications page lacks $meta"; fail=1; }
            grep -q "$meta" _site/cv/index.html || { echo "::error::cv page lacks $meta"; fail=1; }
          done
          for p in awards mytravel Photography; do
            if grep -q "/$p/" _site/sitemap.xml; then echo "::error::$p is in sitemap.xml"; fail=1; fi
          done
          exit $fail

      - name: Compare computed styles with the live main branch
        run: |
          set -e
          git worktree add ../old origin/main
          (cd ../old && JEKYLL_ENV=production bundle exec jekyll build --safe -d "$GITHUB_WORKSPACE/_site_old" > /dev/null)
          npm install --no-save --silent playwright@1.49.1
          npx playwright install --with-deps chromium > /dev/null
          (cd _site && python3 -m http.server 8001 > /dev/null 2>&1 &)
          (cd _site_old && python3 -m http.server 8002 > /dev/null 2>&1 &)
          sleep 2
          cat > styles.mjs <<'JS'
          import { chromium } from 'playwright';
          const sel = {
            body: 'body', text: '.page__content p', link: '.page__content a',
            masthead: '.masthead', navlink: '.masthead__menu-item a', title: '.page__title',
            sidebar: '.sidebar', avatar: '.author__avatar img', authorName: '.author__name',
            footer: '.page__footer', pubItem: '.publication-list li', h2: '.page__content h2',
          };
          const props = ['background-color', 'color', 'font-family', 'font-size', 'width', 'margin-bottom', 'line-height'];
          process.on('unhandledRejection', e => { console.log(`::error title=style script::${String(e && e.stack || e).replace(/\n/g, ' %0A ')}`); process.exit(1); });
          const browser = await chromium.launch();
          for (const vw of [1280, 400]) {
            const ctx = await browser.newContext({ viewport: { width: vw, height: 900 } });
            for (const path of ['/', '/publications/']) {
              const out = {};
              for (const [name, port] of [['old', 8002], ['new', 8001]]) {
                const page = await ctx.newPage();
                await page.goto(`http://localhost:${port}${path}`, { waitUntil: 'load' });
                await page.waitForTimeout(300);
                out[name] = await page.evaluate(([sel, props]) => {
                  const r = {};
                  for (const [k, s] of Object.entries(sel)) {
                    const e = document.querySelector(s);
                    if (!e) { r[k] = 'absent'; continue; }
                    const cs = getComputedStyle(e);
                    const box = e.getBoundingClientRect();
                    r[k] = props.map(p => p + '=' + cs.getPropertyValue(p)).join(' ') + ` box=${Math.round(box.x)},${Math.round(box.y)},${Math.round(box.width)}x${Math.round(box.height)}`;
                  }
                  r.theme = document.documentElement.getAttribute('data-theme');
                  return r;
                }, [sel, props]);
                await page.close();
              }
              const keys = Object.keys(out.new);
              const diffs = keys.filter(k => out.old[k] !== out.new[k]);
              const detail = diffs.map(k => `${k}: old[${out.old[k]}] new[${out.new[k]}]`).join(' %0A ');
              console.log(`::notice title=${vw}px ${path}: ${keys.length - diffs.length} same, ${diffs.length} differ::${detail || 'all identical'}`);
            }
            await ctx.close();
          }
          // Theme toggle switches to light and back
          const page = await browser.newPage();
          await page.goto('http://localhost:8001/');
          await page.click('#theme-toggle a');
          const light = await page.evaluate(() => [document.documentElement.getAttribute('data-theme'), getComputedStyle(document.body).backgroundColor]);
          await page.click('#theme-toggle a');
          const dark = await page.evaluate(() => [document.documentElement.getAttribute('data-theme'), getComputedStyle(document.body).backgroundColor]);
          console.log(`::notice title=toggle::after one click ${JSON.stringify(light)}; after two ${JSON.stringify(dark)}`);
          const errs = [];
          const p2 = await browser.newPage();
          p2.on('pageerror', e => errs.push(e.message));
          p2.on('console', m => { if (m.type() === 'error') errs.push(m.text()); });
          await p2.goto('http://localhost:8001/publications/', { waitUntil: 'load' });
          await p2.waitForTimeout(500);
          console.log(`::notice title=js errors::${errs.length ? errs.join(' ; ') : 'none'}`);
          await browser.close();
          JS
          node styles.mjs
